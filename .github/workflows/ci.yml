name: ci

on:
  push:
    branches: [main]
    # A tag é o que publica o app: o instalador do Windows vira anexo da
    # Release daquela versão.
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# O binário do Electron são uns 100 MB baixados na instalação, e só o job que
# monta o app precisa dele. Os outros instalam as mesmas dependências para
# rodar lint, testes e build do site — nenhum abre janela nenhuma.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  check:
    # Windows está na matriz porque é onde este projeto é escrito, e porque o
    # que quebra só num sistema — caminho com barra invertida, CRLF, o spawn do
    # servidor pelos scripts — quebra lá.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # Node 22 é o piso do projeto: o servidor usa fetch nativo, --watch e
      # fs.statfsSync, e nenhum dos três existe antes disso.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      # O site é o que a atividade carrega. Um PR que quebra o build do cliente
      # não pode ficar verde só porque o servidor continua de pé. Vem antes dos
      # testes porque parte deles fala com o servidor, que serve o que saiu daqui.
      - name: Build do site
        run: npm run build

      - name: Testes
        run: npm test

      # Sobe o próprio servidor numa porta livre e o derruba no fim.
      - name: Smoke do painel
        run: npm run smoke:admin

      # Este outro fala com um servidor já no ar, então quem o sobe é daqui.
      # bash nos dois sistemas: o runner do Windows tem, e um "&" que funciona
      # em cmd e em bash ao mesmo tempo não existe.
      - name: Subir o servidor
        shell: bash
        env:
          NODE_ENV: development
          PORT: 3001
        run: |
          node server/index.js > server.log 2>&1 &
          echo $! > server.pid
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:3001/api/health > /dev/null && exit 0
            sleep 1
          done
          echo 'o servidor não respondeu ao /api/health em 60s'
          cat server.log
          exit 1

      - name: Smoke do relay
        run: npm run smoke

      - name: Smoke da aba de captura
        run: npm run smoke:controle

      # if: always() porque um smoke vermelho deixaria o processo pendurado, e
      # o passo seguinte é o log, que é justamente o que se quer ler quando ele
      # ficou vermelho.
      - name: Derrubar o servidor
        if: always()
        shell: bash
        run: |
          [ -f server.pid ] && kill "$(cat server.pid)" || true
          [ -f server.log ] && cat server.log || true

  coverage:
    # A medida em um sistema só, de propósito: o piso é um número, e dois
    # sistemas medindo o mesmo código dão números levemente diferentes — o
    # `server/system.js` lê /proc onde ele existe. Duas medidas seriam duas
    # discussões sobre qual delas vale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Instalar
        run: npm ci
      - name: Build do site
        run: npm run build
      # O piso de 86% mora no vitest.config.js; aqui só se roda a medida. Abaixo
      # dele o vitest sai diferente de zero, e o PR fica vermelho.
      - name: Coverage
        run: npm run coverage

  app:
    # Windows porque é o alvo que o electron-builder monta aqui, e porque é
    # onde estão as pessoas para quem o app existe: quem não quer abrir um
    # terminal para mostrar a própria tela.
    runs-on: windows-latest
    # Este job é o único que precisa do Electron de verdade. Vazio, e não "0":
    # quem lê a variável só olha se ela tem conteúdo, e "0" tem.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar
        run: npm ci

      # Num PR, só empacota — sem montar instalador. Pega em um minuto o que
      # quebra de verdade aqui (um caminho que saiu do `files`, uma dependência
      # que ficou só no workspace do servidor) sem pagar os cinco minutos do
      # NSIS por revisão.
      - name: Empacotar
        if: github.event_name == 'pull_request'
        run: npm run app:dir

      - name: Instalador
        if: github.event_name != 'pull_request'
        run: npm run app:build

      # Fica baixável em qualquer commit da main, não só nas tags: é assim que
      # se testa uma correção antes de decidir que ela vira versão.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: sala-de-tela-windows
          path: dist-app/*.exe
          if-no-files-found: error

      # Sem action de terceiro: o `gh` já vem no runner e o token também.
      - name: Anexar à Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # Cria a Release na primeira vez; se ela já existir — porque a tag foi
        # empurrada de novo, ou porque alguém a criou à mão —, só troca os
        # anexos.
        run: |
          gh release create "${GITHUB_REF_NAME}" dist-app/*.exe --generate-notes             || gh release upload "${GITHUB_REF_NAME}" dist-app/*.exe --clobber

  docker:
    # A imagem é entrega, não conveniência: o deploy no VPS sobe exatamente
    # esta. Ela quebra sozinha — copiando um caminho que deixou de existir, ou
    # instalando sem uma dependência nova — sem que teste nenhum perceba.
    # Só constrói; não envia nada para lugar nenhum.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construir a imagem
        run: docker build -t sala-de-tela:ci .
